    <!-- Environment shim: ensure window.fetch has both getter and setter for tracking scripts (Meta Pixel, etc.) -->
    <script>
      (function() {
        try {
          var rawFetch = window.fetch;
          var activeFetch = rawFetch ? rawFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            }
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoFetch = window.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return protoFetch;
                },
                set: function(fn) {
                  protoFetch = fn;
                }
              });
            }
          } catch (err) {}
        }
      })();
    </script>

    <!-- Meta Pixel Code (Queue initialized synchronously, script execution deferred for TBT) -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];
      function loadFbq() {
        if (t) return;
        t=b.createElement(e);t.async=!0;t.src=v;
        s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s);
      }
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(loadFbq, { timeout: 1200 });
      } else {
        setTimeout(loadFbq, 800);
      }
      }(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '956876377415583');
      fbq('track', 'PageView');
    </script>
