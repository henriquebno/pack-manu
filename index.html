<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <!-- Environment shim: ensure window.fetch has both getter and setter for tracking scripts (Meta Pixel, etc.) -->
    <script>
      (function() {
        try {
          var rawFetch = window.fetch;
          var activeFetch = rawFetch ? rawFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            }
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoFetch = window.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return protoFetch;
                },
                set: function(fn) {
                  protoFetch = fn;
                }
              });
            }
          } catch (err) {}
        }
      })();
    </script>

    <!-- Meta Pixel Code: Immediate synchronous queue in memory, non-blocking deferred network download -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];
      function loadFbq() {
        if (t) return;
        t=b.createElement(e);t.async=!0;t.src=v;
        s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s);
      }
      var triggered = false;
      function onInteract() {
        if (triggered) return;
        triggered = true;
        loadFbq();
        ['touchstart', 'scroll', 'click', 'keydown', 'mousemove'].forEach(function(evt) {
          window.removeEventListener(evt, onInteract);
        });
      }
      ['touchstart', 'scroll', 'click', 'keydown', 'mousemove'].forEach(function(evt) {
        window.addEventListener(evt, onInteract, { once: true, passive: true });
      });
      setTimeout(onInteract, 3500);
      }(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '956876377415583');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->

    <title>Pack Manu Stories | +15.000 Figurinhas e Elementos para Stories</title>
    <meta name="description" content="+47 mil pessoas já estão deixando seus Stories mais bonitos. Tenha acesso a mais de 15.000 figurinhas e elementos prontos para criar Stories incríveis." />

    <!-- Optimized Google Fonts: font-display: swap with non-blocking media swap -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" />
    </noscript>

    <!-- Script de UTMs Utmify: deferred to first user interaction or idle to unblock FCP -->
    <script>
      (function() {
        var utmTriggered = false;
        function loadUtmify() {
          if (utmTriggered || document.querySelector('script[src*="utmify"]')) return;
          utmTriggered = true;
          var s = document.createElement('script');
          s.src = 'https://cdn.utmify.com.br/scripts/utms/latest.js';
          s.setAttribute('data-utmify-prevent-xcod-sck', '');
          s.setAttribute('data-utmify-prevent-subids', '');
          s.async = true;
          document.head.appendChild(s);
          ['touchstart', 'scroll', 'click', 'keydown', 'mousemove'].forEach(function(evt) {
            window.removeEventListener(evt, loadUtmify);
          });
        }
        ['touchstart', 'scroll', 'click', 'keydown', 'mousemove'].forEach(function(evt) {
          window.addEventListener(evt, loadUtmify, { once: true, passive: true });
        });
        setTimeout(loadUtmify, 3200);
      })();
    </script>
