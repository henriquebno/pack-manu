    <script>
      // 1. Ensure window.fetch has both getter and setter so scripts attempting to wrap fetch do not fail on read-only getter
      (function() {
        try {
          var win = typeof window !== 'undefined' ? window : globalThis;
          var curFetch = win.fetch ? win.fetch.bind(win) : null;
          var descriptor = {
            get: function() {
              return curFetch;
            },
            set: function(newFetch) {
              curFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(win, 'fetch', descriptor);
          } catch (e) {}
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            }
          } catch (e) {}
        } catch (err) {}
      })();

      // 2. Prevent "Converting circular structure to JSON" from tracking scripts logging DOM elements with React Fibers
      (function() {
        try {
          var origStringify = JSON.stringify;
          JSON.stringify = function(value, replacer, space) {
            var seen = new WeakSet();
            function circularReplacer(key, val) {
              if (typeof val === 'object' && val !== null) {
                if (typeof Node !== 'undefined' && val instanceof Node) {
                  return {
                    nodeType: val.nodeType,
                    tagName: val.tagName,
                    id: val.id,
                    className: val.className
                  };
                }
                if (typeof Window !== 'undefined' && val instanceof Window) {
                  return '[Window]';
                }
                if (seen.has(val)) {
                  return '[Circular]';
                }
                seen.add(val);
              }
              if (typeof replacer === 'function') {
                return replacer.call(this, key, val);
              }
              return val;
            }

            if (Array.isArray(replacer)) {
              return origStringify.call(this, value, replacer, space);
            }

            try {
              return origStringify.call(this, value, circularReplacer, space);
            } catch (e) {
              return '"[Circular]"';
            }
          };

          // Sanitize console arguments so logging DOM nodes doesn't trigger circular JSON serialization in iframe bridges
          var methods = ['log', 'info', 'warn', 'error', 'debug'];
          methods.forEach(function(m) {
            if (typeof console !== 'undefined' && console[m]) {
              var origMethod = console[m];
              console[m] = function() {
                var safeArgs = [];
                for (var i = 0; i < arguments.length; i++) {
                  var a = arguments[i];
                  if (a && typeof a === 'object') {
                    if ((typeof Node !== 'undefined' && a instanceof Node) || a.nodeType) {
                      safeArgs.push('[Element ' + (a.tagName || 'node') + (a.id ? '#' + a.id : '') + ']');
                      continue;
                    }
                    if (Array.isArray(a)) {
                      safeArgs.push(a.map(function(item) {
                        if (item && typeof item === 'object' && ((typeof Node !== 'undefined' && item instanceof Node) || item.nodeType)) {
                          return '[Element ' + (item.tagName || 'node') + (item.id ? '#' + item.id : '') + ']';
                        }
                        return item;
                      }));
                      continue;
                    }
                  }
                  safeArgs.push(a);
                }
                return origMethod.apply(this, safeArgs);
              };
            }
          });
        } catch (e) {}
      })();
    </script>
